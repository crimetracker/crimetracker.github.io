<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>범죄추적기</title>

  <!-- ★ 링크 공유 시 보이는 미리보기 설정 ★ -->
  <meta name="description" content="공개 보도된 범죄 소식을 유형별로 모아 간략하게 요약합니다.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="범죄추적기">
  <meta property="og:title" content="범죄추적기">
  <meta property="og:description" content="공개 보도된 범죄 소식을 유형별로 모아 간략하게 요약합니다.">
  <meta property="og:url" content="https://crimetracker.github.io/">
  <!-- 미리보기 이미지: 저장소에 preview.png 를 올리면 자동으로 사용돼요 (권장 크기 1200x630) -->
  <meta property="og:image" content="https://crimetracker.github.io/preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="범죄추적기">
  <style>
    :root {
      --dark: #0f172a;
      --dark-2: #1e293b;
      --side-text: #cbd5e1;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --accent: #e11d48;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .inner { max-width: 1000px; margin: 0 auto; padding: 0 24px; }

    /* ===== 1줄: 제목 + 로고 ===== */
    .site-header { background: var(--dark); color: #fff; }
    .site-header .inner {
      display: grid; grid-template-columns: 1fr auto 1fr;
      align-items: center; height: 72px;
    }
    .brand {
      display: flex; align-items: baseline; flex-wrap: wrap; column-gap: 10px;
      cursor: pointer; justify-self: start;
    }
    .brand-main { font-size: 24px; font-weight: 800; }
    .brand-main b { color: var(--accent); }
    /* 제목 옆 부제: 제목 크기의 1/3, 옅은 회백색 하늘색 */
    .brand-sub { font-size: calc(24px / 3); color: #b9cbdc; letter-spacing: .04em; white-space: nowrap; }
    .logo-img { height: 48px; width: auto; justify-self: center; cursor: pointer; }

    /* ===== 2줄: 메뉴 버튼 + 기사 검색 ===== */
    .toolbar {
      position: sticky; top: 0; z-index: 10;
      background: #fff; border-bottom: 1px solid var(--line);
    }
    .toolbar .inner { display: flex; align-items: center; gap: 12px; height: 64px; }
    .menu-btn {
      flex-shrink: 0;
      display: flex; align-items: center; gap: 8px;
      background: var(--dark); color: #fff; border: 0;
      font-size: 15px; font-weight: 700; padding: 10px 16px; border-radius: 10px;
      cursor: pointer;
    }
    .menu-btn:hover { background: var(--accent); }
    .search-wrap { position: relative; flex: 1; }
    .search {
      width: 100%; padding: 11px 40px 11px 14px; font-size: 15px;
      border: 1px solid var(--line); border-radius: 10px; background: var(--bg);
    }
    .search:focus { outline: 2px solid var(--accent); border-color: transparent; background: #fff; }
    .search-clear {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      background: none; border: 0; font-size: 20px; color: var(--muted);
      cursor: pointer; display: none; padding: 4px 8px;
    }
    .search-clear.show { display: block; }

    /* ===== 메뉴 패널 (왼쪽에서 스르륵 나와 뉴스 위에 덮임) ===== */
    .drawer {
      position: fixed; top: 0; left: 0; bottom: 0;
      width: 260px; max-width: 80vw;
      background: var(--dark); color: var(--side-text);
      padding: 20px 16px;
      display: flex; flex-direction: column;
      z-index: 30;
      transform: translateX(-100%);
      transition: transform .3s ease, box-shadow .3s ease;
    }
    .drawer.open { transform: translateX(0); box-shadow: 4px 0 24px rgba(0,0,0,.25); }
    .drawer-head {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 8px 16px; border-bottom: 1px solid var(--dark-2); margin-bottom: 8px;
    }
    .drawer-head strong { color: #fff; font-size: 18px; }
    .drawer-close { background: none; border: 0; color: #fff; font-size: 24px; cursor: pointer; line-height: 1; }
    .menu-wrap { flex: 1; overflow-y: auto; }
    .menu { list-style: none; display: flex; flex-direction: column; gap: 2px; }
    .menu .label { font-size: 11px; color: #64748b; font-weight: 700; padding: 14px 12px 4px; letter-spacing: .05em; }
    .menu button {
      width: 100%; text-align: left;
      background: none; border: 0; color: inherit;
      font-size: 15px; padding: 9px 12px; border-radius: 8px;
      cursor: pointer; display: flex; justify-content: space-between; align-items: center;
    }
    .menu button:hover { background: var(--dark-2); color: #fff; }
    .menu button.active { background: var(--accent); color: #fff; font-weight: 700; }
    .menu .count { font-size: 12px; opacity: .7; }
    /* 메뉴 항목이 하나씩 차례로 나타나는 효과 */
    .drawer.open .menu li { animation: itemIn .35s ease both; }
    @keyframes itemIn { from { opacity: 0; transform: translateX(-16px); } to { opacity: 1; transform: none; } }
    .drawer-foot { font-size: 12px; color: #64748b; padding: 16px 8px 0; }

    .overlay {
      position: fixed; inset: 0; background: rgba(15,23,42,.45);
      z-index: 25; opacity: 0; pointer-events: none; transition: opacity .3s ease;
    }
    .overlay.show { opacity: 1; pointer-events: auto; }

    /* ===== 3줄 이하: 본문 ===== */
     main.inner { padding-top: 28px; padding-bottom: 40px; }   /* 본문 위아래 여백 */
    .page-title { font-size: 24px; margin-bottom: 2px; }
    .page-desc { color: var(--muted); margin-bottom: 20px; font-size: 14px; word-break: keep-all; }
    .notice {
      background: #fff7ed; border: 1px solid #fed7aa; color: #9a3412;
      padding: 10px 14px; border-radius: 8px; font-size: 14px; margin-bottom: 16px;
    }

    /* 기사 목록 (제목만 보이고 클릭해야 열림) */
    .list { list-style: none; display: flex; flex-direction: column; gap: 12px; }
    .item {
      background: var(--card); border: 1px solid var(--line); border-radius: 12px;
      padding: 18px 20px; cursor: pointer; transition: border-color .15s, transform .15s;
    }
    .item:hover { border-color: var(--accent); transform: translateY(-2px); }
    .item.has-img, .item.ranked { display: flex; gap: 14px; align-items: center; }
    .item .rank { font-size: 22px; font-weight: 800; color: var(--accent); width: 28px; flex-shrink: 0; text-align: center; }
    .item .thumb { width: 120px; height: 80px; flex-shrink: 0; object-fit: cover; border-radius: 8px; background: var(--line); }
    .item .text { min-width: 0; }
    .meta { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { background: #ffe4e6; color: var(--accent); font-weight: 700; padding: 2px 8px; border-radius: 999px; font-size: 12px; }
    .item h3 { font-size: 17px; margin-top: 4px; }
    .more { font-size: 13px; color: var(--accent); margin-top: 4px; }
    .empty { color: var(--muted); padding: 40px 0; text-align: center; list-style: none; }

    /* 기사 상세 */
    .detail { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 28px; }
    .back { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-size: 14px; margin-top: 16px; margin-bottom: 16px; }
    .back:hover { border-color: var(--accent); color: var(--accent); }
    .detail h2 { font-size: 24px; margin: 10px 0 16px; }
    .detail-img { width: 100%; border-radius: 10px; margin-bottom: 6px; display: block; }
    .img-caption { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
    .summary-box { background: #f8fafc; border-left: 4px solid var(--accent); padding: 12px 16px; border-radius: 6px; margin-bottom: 20px; font-size: 15px; }
    .keywords { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
    .keywords span { font-size: 13px; background: #f1f5f9; color: #334155; padding: 3px 10px; border-radius: 999px; }
    .detail .body p { margin-bottom: 14px; }
    .source { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }
    .source a { color: var(--accent); }

    /* ===== 게시판 ===== */
    .board-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 6px; }
    .board-head .page-title { margin-bottom: 0; }
    .board-head .btn { flex-shrink: 0; }
    .btn {
      background: var(--dark); color: #fff; border: 0; border-radius: 10px;
      padding: 10px 16px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit;
    }
    .btn:hover { background: var(--accent); }
    .btn:disabled { opacity: .5; cursor: default; }
    .btn.ghost { background: none; color: var(--text); border: 1px solid var(--line); }
    .btn.ghost:hover { border-color: var(--accent); color: var(--accent); }
    .post-form {
      display: none; position: relative;
      background: var(--card); border: 1px solid var(--line); border-radius: 12px;
      padding: 20px; margin-bottom: 20px;
    }
    .post-form.open { display: block; }
    .post-form label { display: block; font-size: 14px; font-weight: 700; margin: 12px 0 6px; }
    .post-form input, .post-form textarea {
      width: 100%; padding: 10px 12px; font-size: 15px; font-family: inherit;
      border: 1px solid var(--line); border-radius: 8px; background: var(--bg);
    }
    .post-form input:focus, .post-form textarea:focus { outline: 2px solid var(--accent); border-color: transparent; background: #fff; }
    .post-form textarea { min-height: 140px; resize: vertical; }
    .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
    .form-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 14px; }
    .form-foot .btns { display: flex; gap: 8px; }
    .counter { font-size: 13px; color: var(--muted); }
    .form-msg { font-size: 14px; margin-top: 10px; }
    .form-msg.ok { color: #15803d; }
    .form-msg.err { color: var(--accent); }
    /* 게시글 상세 (기사 상세와 같은 모양) */
    .post-body { white-space: pre-wrap; word-break: break-word; margin-bottom: 20px; }
    .pre { white-space: pre-wrap; word-break: break-word; margin-top: 4px; }

    /* 댓글 */
    .comments { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line); }
    .comments h3 { font-size: 16px; margin-bottom: 12px; }
    .comment-list { list-style: none; display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
    .comment-list li { background: #f8fafc; border-radius: 8px; padding: 10px 14px; }
    .comment-list p { white-space: pre-wrap; word-break: break-word; font-size: 15px; margin-top: 2px; }
    .no-comment { color: var(--muted); font-size: 14px; margin-bottom: 16px; }
    .comment-form input, .comment-form textarea {
      width: 100%; padding: 10px 12px; font-size: 15px; font-family: inherit;
      border: 1px solid var(--line); border-radius: 8px; background: var(--bg);
    }
    .comment-form input { max-width: 240px; margin-bottom: 8px; }
    .comment-form textarea { min-height: 80px; resize: vertical; }
    .comment-form input:focus, .comment-form textarea:focus { outline: 2px solid var(--accent); border-color: transparent; background: #fff; }

    /* ===== 모바일 ===== */
    @media (max-width: 600px) {
      .inner { padding: 0 16px; }
      main.inner { padding-top: 24px; padding-bottom: 40px; }   /* 모바일: 본문 위아래 여백 */
      .site-header .inner { height: 60px; }
      .brand-main { font-size: 20px; }
      .brand-sub { font-size: calc(20px / 3); }
      .logo-img { height: 36px; }
      .toolbar .inner { height: 60px; gap: 8px; }
      .menu-btn { padding: 10px 12px; }
      .detail { padding: 20px; }
      .item .thumb { width: 88px; height: 64px; }
      .board-head .btn { padding: 8px 12px; font-size: 14px; }
    }
  </style>
</head>
<body>

  <!-- 1줄: 제목 + 로고 -->
  <header class="site-header">
    <div class="inner">
      <div class="brand" id="brand">
        <span class="brand-main">범죄<b>추적기</b></span>
        <span class="brand-sub">CRIME TRACKER_ 사건 사고 뉴스 요약 정보</span>
      </div>
      <!-- 로고 이미지: 저장소의 crimetracker-logo.svg 를 표시해요 (없으면 자동으로 숨김) -->
      <img class="logo-img" id="logoImg" src="crimetracker-logo.svg" alt="범죄추적기 로고" onerror="this.style.display='none'">
      <div></div>
    </div>
  </header>

  <!-- 2줄: 메뉴 버튼 + 기사 검색 -->
  <div class="toolbar">
    <div class="inner">
      <button class="menu-btn" id="menuBtn" aria-label="메뉴 열기">☰ 메뉴</button>
      <div class="search-wrap">
        <input class="search" id="search" type="text" enterkeyhint="search" placeholder="기사 검색 (제목·요약·지역·키워드)">
        <button class="search-clear" id="searchClear" aria-label="검색어 지우기">×</button>
      </div>
    </div>
  </div>

  <!-- 메뉴 패널 -->
  <div class="overlay" id="overlay"></div>
  <nav class="drawer" id="drawer" aria-label="범죄 유형 메뉴">
    <div class="drawer-head">
      <strong>메뉴</strong>
      <button class="drawer-close" id="drawerClose" aria-label="메뉴 닫기">×</button>
    </div>
    <div class="menu-wrap"><ul class="menu" id="menu"></ul></div>
    <div class="drawer-foot">공개 보도를 요약한 정보입니다.<br>원문은 각 기사의 출처를 확인하세요.</div>
  </nav>

  <!-- 3줄 이하: 본문 -->
  <main class="inner" id="content"><p class="empty">기사를 불러오는 중이에요…</p></main>

  <script>
    /* =========================================================
       ★ 설정 (필요하면 여기 숫자·글자만 바꾸세요) ★
       기사는 구글 시트 '기사' 탭(또는 articles.json)에서 추가·수정해요.

       [기간 규칙]  (한 주 = 일요일 ~ 토요일, 매주 일요일에 자동으로 바뀜)
       - 최신 뉴스   : 지난주 기사, 최신순 최대 HOT_LIMIT개
       - 지난 핫뉴스 : 최신 뉴스 이전 PAST_WEEKS주(2~3주 전) 기사, 최신순 최대 PAST_LIMIT개
       - 이번 주 기사와 그보다 오래된 기사 : 메뉴의 '전체'와 각 범죄 유형에서 볼 수 있음
       ========================================================= */
    const CATEGORIES = ["전체", "살인", "강도", "강간", "폭행", "절도", "마약", "보이스피싱", "교통범죄", "사기", "기타"];
    const HOT_LIMIT = 10;   // 최신 뉴스 최대 개수
    const PAST_WEEKS = 2;   // 지난 핫뉴스에 넣을 주 수 (최신 뉴스 주 이전부터)
    const PAST_LIMIT = 20;  // 지난 핫뉴스 최대 개수

    /* 구글 앱스 스크립트 웹 앱 주소 (https://script.google.com/macros/s/…/exec)
       - 비워두면: 기사는 articles.json에서 읽고, 게시판은 '준비 중'으로 보여요.
       - 채우면:   기사는 구글 시트 '기사' 탭에서 읽고, 게시판이 작동해요.
                   (시트를 못 읽으면 자동으로 articles.json을 대신 읽어요) */
    const API_URL = "https://script.google.com/macros/s/AKfycbzwz8774cRSV8-fXr44KAr6Rq0sOHnon1suwsEj6dWMCKdIuq039QMXdReLFK9cfJt9aA/exec";

    /* ===================== 아래는 수정하지 않아도 돼요 ===================== */
    const $menu = document.getElementById("menu");
    const $content = document.getElementById("content");
    const $drawer = document.getElementById("drawer");
    const $overlay = document.getElementById("overlay");
    const $search = document.getElementById("search");
    const $searchClear = document.getElementById("searchClear");
    let articles = [];
    let searchText = "";
    let navCount = 0;

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    /* ---- 날짜·주 계산 (일요일 시작 ~ 토요일 끝) ---- */
    function parseDate(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
    function fmt(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
    function weekKeyOf(date) {
      const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      d.setDate(d.getDate() - d.getDay());
      return fmt(d);
    }
    function weekLabel(key) {
      const s = parseDate(key), e = new Date(s);
      e.setDate(e.getDate() + 6);
      return `${s.getMonth() + 1}월 ${s.getDate()}일 ~ ${e.getMonth() + 1}월 ${e.getDate()}일`;
    }
    const thisWeek = () => weekKeyOf(new Date());
    function weekAgo(n) {                       // n주 전 일요일 날짜
      const w = parseDate(thisWeek());
      w.setDate(w.getDate() - 7 * n);
      return fmt(w);
    }
    const byNewest = (a, b) => b.date.localeCompare(a.date) || b.id - a.id;
    const inWeek = key => articles.filter(a => weekKeyOf(parseDate(a.date)) === key).sort(byNewest);
    const hotOf = key => inWeek(key).slice(0, HOT_LIMIT);
    function pastWeeks() {                      // 2주 전 ~ (1 + PAST_WEEKS)주 전
      const keys = [];
      for (let i = 2; i <= 1 + PAST_WEEKS; i++) keys.push(weekAgo(i));
      return keys;
    }

    /* ---- 화면 상태 (주소 # 뒤에 저장) ---- */
    function getState() {
      const h = decodeURIComponent(location.hash.slice(1));
      if (h.startsWith("article=")) return { view: "article", id: Number(h.slice(8)) };
      if (h.startsWith("cat=")) return { view: "cat", cat: h.slice(4) };
      if (h === "archive") return { view: "archive" };
      if (h === "board") return { view: "board" };
      if (h.startsWith("post=")) return { view: "post", id: Number(h.slice(5)) };
      return { view: "hot" };
    }
    function go(hash) { location.hash = hash; }

    /* ---- 메뉴 패널 ---- */
    function renderMenu(activeKey) {
      let i = 0;
      const btn = (key, label, count) =>
        `<li style="animation-delay:${(i++) * 0.03}s"><button data-key="${esc(key)}" class="${key === activeKey ? "active" : ""}">
           <span>${label}</span>${count !== undefined ? `<span class="count">${count}</span>` : ""}</button></li>`;
      let html = btn("hot", "📰 최신 뉴스")
               + btn("archive", "📅 지난 핫뉴스")
               + btn("board", "💬 게시판")
               + `<li class="label">범죄 유형</li>`;
      CATEGORIES.forEach(c => {
        const n = c === "전체" ? articles.length : articles.filter(a => a.category === c).length;
        html += btn("cat:" + c, esc(c), n);
      });
      $menu.innerHTML = html;
    }

    /* ---- 기사 목록 공통 ---- */
    function listHTML(list, ranked) {
      if (!list.length) return `<ul class="list"><li class="empty">해당하는 기사가 없어요.</li></ul>`;
      return `<ul class="list">${list.map((a, i) => `
        <li class="item ${a.image ? "has-img" : ""} ${ranked ? "ranked" : ""}" data-id="${a.id}">
          ${ranked ? `<div class="rank">${i + 1}</div>` : ""}
          ${a.image ? `<img class="thumb" src="${esc(a.image)}" alt="" loading="lazy">` : ""}
          <div class="text">
            <div class="meta"><span class="tag">${esc(a.category)}</span>${esc(a.date)} · ${esc(a.region)}</div>
            <h3>${esc(a.title)}</h3>
            <div class="more">자세히 보기 →</div>
          </div>
        </li>`).join("")}</ul>`;
    }

    /* ---- 각 화면 ---- */
    function viewHot() {
      const key = weekAgo(1);                   // 지난주
      const list = hotOf(key);
      return `<h1 class="page-title">📰 최신 뉴스</h1>
              <p class="page-desc">${weekLabel(key)} · 지난주 주요 사건이에요. 매주 일요일에 새로 바뀌어요.</p>
              ${list.length ? listHTML(list, true) : `<ul class="list"><li class="empty">아직 등록된 최신 뉴스가 없어요.</li></ul>`}`;
    }

    function viewArchive() {
      const keys = pastWeeks();
      const list = articles
        .filter(a => keys.includes(weekKeyOf(parseDate(a.date))))
        .sort(byNewest)
        .slice(0, PAST_LIMIT);
      return `<h1 class="page-title">📅 지난 핫뉴스</h1>
              <p class="page-desc">최신 뉴스 이전 ${PAST_WEEKS}주간의 기사예요. 더 이전 기사는 메뉴의 '전체'나 범죄 유형에서 볼 수 있어요.</p>
              ${list.length ? listHTML(list) : `<ul class="list"><li class="empty">아직 지난 핫뉴스가 없어요.</li></ul>`}`;
    }

    function viewBoard() {
      if (!API_URL) {
        return `<h1 class="page-title">💬 게시판</h1>
                <p class="page-desc">자유롭게 의견을 남기는 공간이에요.</p>
                <div class="notice">게시판은 준비 중이에요. 곧 열릴 예정이에요.</div>`;
      }
      return `<div class="board-head">
          <h1 class="page-title">💬 게시판</h1>
          <button class="btn" data-write>✏️ 글쓰기</button>
        </div>
        <p class="page-desc">자유롭게 의견을 남겨 주세요. 관리자 승인 후 게시돼요.</p>
        <form class="post-form" id="postForm" autocomplete="off">
          <div class="notice">실명·연락처 등 개인정보, 특정인 비방, 확인되지 않은 신상 정보가 담긴 글은 게시되지 않아요.</div>
          <label for="pNick">닉네임</label>
          <input id="pNick" maxlength="20" placeholder="비워두면 '익명'으로 올라가요">
          <label for="pTitle">제목</label>
          <input id="pTitle" maxlength="60" required>
          <label for="pBody">내용</label>
          <textarea id="pBody" maxlength="1000" required></textarea>
          <div class="hp" aria-hidden="true"><input id="pWebsite" tabindex="-1" autocomplete="off"></div>
          <div class="form-foot">
            <span class="counter" id="pCount">0 / 1000</span>
            <div class="btns">
              <button type="button" class="btn ghost" data-cancel>취소</button>
              <button type="submit" class="btn">등록</button>
            </div>
          </div>
          <div class="form-msg" id="pMsg"></div>
        </form>
        <ul class="list" id="postList"><li class="empty">글을 불러오는 중이에요…</li></ul>`;
    }

    async function loadPosts() {
      const $list = document.getElementById("postList");
      if (!$list) return;
      try {
        const r = await fetch(API_URL + "?action=posts");
        const d = await r.json();
        if (!d.ok) throw new Error();
        $list.innerHTML = d.posts.length
          ? d.posts.map(p => `
            <li class="item" data-post="${p.id}">
              <div class="text">
                <div class="meta">${esc(p.nickname)} · ${esc(p.date)}${p.comments ? ` · 💬 ${p.comments}` : ""}</div>
                <h3>${esc(p.title)}</h3>
                <div class="more">자세히 보기 →</div>
              </div>
            </li>`).join("")
          : `<li class="empty">아직 게시된 글이 없어요. 첫 글을 남겨 주세요!</li>`;
      } catch (err) {
        $list.innerHTML = `<li class="empty">글을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.</li>`;
      }
    }

    function viewPostShell() {
      return `<button class="back" data-back="board">← 게시판으로</button>
              <div id="postDetail"><p class="empty">글을 불러오는 중이에요…</p></div>`;
    }

    async function loadPost(id) {
      const $box = document.getElementById("postDetail");
      if (!$box) return;
      try {
        const r = await fetch(API_URL + "?action=post&id=" + encodeURIComponent(id));
        const d = await r.json();
        if (!d.ok) { $box.innerHTML = `<div class="notice">${esc(d.error || "글을 찾을 수 없어요.")}</div>`; return; }
        const p = d.post;
        $box.innerHTML = `
          <article class="detail">
            <div class="meta"><span class="tag">게시판</span>${esc(p.nickname)} · ${esc(p.date)}</div>
            <h2>${esc(p.title)}</h2>
            <div class="post-body">${esc(p.body)}</div>
            ${p.reply ? `<div class="summary-box"><b>관리자 답변</b><div class="pre">${esc(p.reply)}</div></div>` : ""}
            <section class="comments">
              <h3>댓글 ${p.comments.length}</h3>
              ${p.comments.length
                ? `<ul class="comment-list">${p.comments.map(c => `
                    <li><div class="meta">${esc(c.nickname)} · ${esc(c.date)}</div><p>${esc(c.body)}</p></li>`).join("")}</ul>`
                : `<p class="no-comment">아직 댓글이 없어요. 첫 댓글을 남겨 주세요.</p>`}
              <form class="comment-form" id="commentForm" data-post-id="${p.id}" autocomplete="off">
                <input id="cNick" maxlength="20" placeholder="닉네임 (비워두면 익명)">
                <textarea id="cBody" maxlength="300" placeholder="댓글은 관리자 승인 후 보여요. 실명·신상 정보와 비방은 게시되지 않아요." required></textarea>
                <div class="hp" aria-hidden="true"><input id="cWebsite" tabindex="-1" autocomplete="off"></div>
                <div class="form-foot">
                  <span class="counter" id="cCount">0 / 300</span>
                  <button type="submit" class="btn">댓글 등록</button>
                </div>
                <div class="form-msg" id="cMsg"></div>
              </form>
            </section>
          </article>`;
      } catch (err) {
        $box.innerHTML = `<div class="notice">글을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.</div>`;
      }
    }

    async function sendToSheet(data) {
      const r = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(data)
      });
      return r.json();
    }

    async function submitComment(form) {
      const $msg = document.getElementById("cMsg");
      const $btn = form.querySelector('button[type="submit"]');
      const data = {
        type: "comment",
        postId: Number(form.dataset.postId),
        nickname: document.getElementById("cNick").value.trim(),
        body: document.getElementById("cBody").value.trim(),
        website: document.getElementById("cWebsite").value
      };
      if (!data.body) {
        $msg.className = "form-msg err"; $msg.textContent = "댓글 내용을 입력해 주세요.";
        return;
      }
      $btn.disabled = true;
      $msg.className = "form-msg"; $msg.textContent = "등록하는 중이에요…";
      try {
        const d = await sendToSheet(data);
        if (!d.ok) { $msg.className = "form-msg err"; $msg.textContent = d.error || "등록하지 못했어요."; return; }
        form.reset();
        document.getElementById("cCount").textContent = "0 / 300";
        $msg.className = "form-msg ok";
        $msg.textContent = "등록되었어요! 관리자 승인 후 댓글이 보여요.";
      } catch (err) {
        $msg.className = "form-msg err";
        $msg.textContent = "등록하지 못했어요. 잠시 후 다시 시도해 주세요.";
      } finally {
        $btn.disabled = false;
      }
    }

    async function submitPost(form) {
      const $msg = document.getElementById("pMsg");
      const $btn = form.querySelector('button[type="submit"]');
      const data = {
        type: "post",
        nickname: document.getElementById("pNick").value.trim(),
        title: document.getElementById("pTitle").value.trim(),
        body: document.getElementById("pBody").value.trim(),
        website: document.getElementById("pWebsite").value
      };
      if (!data.title || !data.body) {
        $msg.className = "form-msg err"; $msg.textContent = "제목과 내용을 입력해 주세요.";
        return;
      }
      $btn.disabled = true;
      $msg.className = "form-msg"; $msg.textContent = "등록하는 중이에요…";
      try {
        const d = await sendToSheet(data);
        if (!d.ok) {
          $msg.className = "form-msg err"; $msg.textContent = d.error || "등록하지 못했어요.";
          return;
        }
        form.reset();
        document.getElementById("pCount").textContent = "0 / 1000";
        $msg.className = "form-msg ok";
        $msg.textContent = "등록되었어요! 관리자 승인 후 게시판에 보여요.";
      } catch (err) {
        $msg.className = "form-msg err";
        $msg.textContent = "등록하지 못했어요. 잠시 후 다시 시도해 주세요.";
      } finally {
        $btn.disabled = false;
      }
    }

    function viewCategory(cat) {
      const list = articles.filter(a => cat === "전체" || a.category === cat).sort(byNewest);
      return `<h1 class="page-title">${esc(cat === "전체" ? "전체 사건" : cat)}</h1>
              <p class="page-desc">제목을 누르면 기사 요약을 볼 수 있어요. 총 ${list.length}건</p>
              ${listHTML(list)}`;
    }

    function viewSearch() {
      const q = searchText.trim().toLowerCase();
      const list = articles.filter(a =>
        [a.title, a.summary, a.region, a.category, ...(a.keywords || [])].join(" ").toLowerCase().includes(q)
      ).sort(byNewest);
      return `<h1 class="page-title">"${esc(searchText.trim())}" 검색 결과</h1>
              <p class="page-desc">전체 기사에서 ${list.length}건을 찾았어요.</p>
              ${listHTML(list)}`;
    }

    function viewArticle(id) {
      const a = articles.find(x => x.id === id);
      if (!a) return `<div class="notice">기사를 찾을 수 없어요.</div>`;
      return `<button class="back" data-back>← 목록으로</button>
        <article class="detail">
          <div class="meta"><span class="tag">${esc(a.category)}</span>${esc(a.date)} · ${esc(a.region)}</div>
          <h2>${esc(a.title)}</h2>
          ${a.image ? `<img class="detail-img" src="${esc(a.image)}" alt="${esc(a.title)}">
            <div class="img-caption">${esc(a.imageCaption)}</div>` : ""}
          <div class="summary-box">${esc(a.summary)}</div>
          ${(a.keywords || []).length ? `<div class="keywords">${a.keywords.map(k => `<span>#${esc(k)}</span>`).join("")}</div>` : ""}
          <div class="body">${(a.content || []).map(p => `<p>${esc(p)}</p>`).join("")}</div>
          <div class="source">출처: <a href="${esc(a.sourceUrl)}" target="_blank" rel="noopener">${esc(a.sourceName)}</a></div>
        </article>`;
    }

    /* ---- 화면 그리기 ---- */
    function render() {
      let html, active;
      const st = getState();

      if (searchText.trim() && st.view !== "article") {
        html = viewSearch(); active = "";
      } else if (st.view === "article") {
        const a = articles.find(x => x.id === st.id);
        html = viewArticle(st.id); active = a ? "cat:" + a.category : "";
      } else if (st.view === "cat") {
        html = viewCategory(st.cat); active = "cat:" + st.cat;
      } else if (st.view === "archive") {
        html = viewArchive(); active = "archive";
      } else if (st.view === "board") {
        html = viewBoard(); active = "board";
      } else if (st.view === "post") {
        html = API_URL ? viewPostShell() : viewBoard(); active = "board";
      } else {
        html = viewHot(); active = "hot";
      }

      renderMenu(active);
      $content.innerHTML = html;
      closeMenu();
      if (API_URL && st.view === "board" && !searchText.trim()) loadPosts();
      if (API_URL && st.view === "post" && !searchText.trim()) loadPost(st.id);
    }

    function openMenu() {
      renderMenu($menu.querySelector(".active")?.dataset.key || "");   // 열 때마다 항목 등장 효과
      $drawer.classList.add("open");
      $overlay.classList.add("show");
    }
    function closeMenu() { $drawer.classList.remove("open"); $overlay.classList.remove("show"); }
    function clearSearch() { searchText = ""; $search.value = ""; $searchClear.classList.remove("show"); }
    function goHome() { clearSearch(); if (location.hash) go(""); else render(); window.scrollTo(0, 0); }

    /* ---- 클릭·입력 처리 ---- */
    $menu.addEventListener("click", e => {
      const b = e.target.closest("button");
      if (!b) return;
      clearSearch();
      const key = b.dataset.key;
      const target = key === "hot" ? "" : key === "archive" ? "archive" : key === "board" ? "board" : "cat=" + encodeURIComponent(key.slice(4));
      if (location.hash.slice(1) === target) render(); else go(target);
      window.scrollTo(0, 0);
    });
    $content.addEventListener("click", e => {
      const back = e.target.closest("[data-back]");
      if (back) {
        if (navCount > 0) history.back(); else go(back.dataset.back || "");
        return;
      }
      const postItem = e.target.closest(".item[data-post]");
      if (postItem) { go("post=" + postItem.dataset.post); window.scrollTo(0, 0); return; }
      const item = e.target.closest(".item");
      if (item) { go("article=" + item.dataset.id); window.scrollTo(0, 0); return; }
      if (e.target.closest("[data-write]")) {
        const form = document.getElementById("postForm");
        form.classList.toggle("open");
        if (form.classList.contains("open")) document.getElementById("pTitle").focus();
        return;
      }
      if (e.target.closest("[data-cancel]")) {
        document.getElementById("postForm").classList.remove("open");
      }
    });
    $content.addEventListener("submit", e => {
      if (e.target.id === "postForm") { e.preventDefault(); submitPost(e.target); }
      if (e.target.id === "commentForm") { e.preventDefault(); submitComment(e.target); }
    });
    $content.addEventListener("input", e => {
      if (e.target.id === "pBody") {
        document.getElementById("pCount").textContent = e.target.value.length + " / 1000";
      }
      if (e.target.id === "cBody") {
        document.getElementById("cCount").textContent = e.target.value.length + " / 300";
      }
    });
    $search.addEventListener("input", () => {
      searchText = $search.value;
      $searchClear.classList.toggle("show", !!searchText);
      const v = getState().view;
      if (v === "article" || v === "post") go("");
      else render();
    });
    $searchClear.onclick = () => { clearSearch(); render(); $search.focus(); };
    document.getElementById("brand").onclick = goHome;
    document.getElementById("logoImg").onclick = goHome;
    document.getElementById("menuBtn").onclick = openMenu;
    document.getElementById("drawerClose").onclick = closeMenu;
    $overlay.onclick = closeMenu;
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeMenu(); });
    window.addEventListener("hashchange", () => { navCount++; render(); });

    /* ---- 기사 불러오기 ---- */
    async function loadArticles() {
      if (API_URL) {
        try {
          const r = await fetch(API_URL + "?action=articles");
          const d = await r.json();
          if (d.ok && d.articles.length) return d.articles;
        } catch (err) { /* 시트를 못 읽으면 아래 articles.json으로 */ }
      }
      const r = await fetch("articles.json", { cache: "no-store" });
      return r.json();
    }

    loadArticles()
      .then(data => { articles = data; render(); })
      .catch(() => {
        $content.innerHTML = `<div class="notice">기사 목록을 불러오지 못했어요. articles.json 파일이 있는지, 형식이 맞는지 확인해 주세요.</div>`;
      });
  </script>
</body>
</html>
